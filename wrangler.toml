name = "roundwise-backend"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "roundwise"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
